<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#8fc6c0;font-family:"Helvetica Neue",Arial,sans-serif}
.row{display:flex;height:330px}.shop{flex:1;border-right:16px solid #e9e4d8;background:#9dd0c9;padding:30px 24px;display:flex;flex-direction:column;gap:14px}
.sb{padding:18px;font-weight:800;font-size:44px;color:#fff;text-align:center;border:5px solid #141414}.sb small{display:block;font-size:24px;font-weight:600}
.no{align-self:flex-end;background:#141414;color:#f2c230;font-size:22px;padding:6px 12px}
.arcade{height:570px;background:repeating-linear-gradient(90deg,#e9e4d8 0 60px,transparent 60px 360px),#1e5b3a10;position:relative}
.floor{position:absolute;left:0;right:0;bottom:0;height:150px;background:conic-gradient(from 45deg,#c8102e 25%,#f4efe4 0 50%,#1e5b3a 0 75%,#f4efe4 0) 0 0/60px 60px}
.hero{position:absolute;left:420px;top:40px;width:600px;height:360px;background:radial-gradient(circle at 50% 60%,#c8a06a,#7a5a34 60%,transparent 61%)}
.cap{position:absolute;left:80px;top:80px;font-size:72px;font-weight:800;color:#141414;width:330px}.cap small{display:block;font-size:24px;font-weight:500}
</style></head><body>
<div class="row"><div class="shop"><div class="sb" style="background:#c8102e">KEDAI KOPI<small>Kopitiam · teh tarik, roti canai</small></div><div class="no">No. 12</div></div>
<div class="shop"><div class="sb" style="background:#1e5b3a">BENGKEL<small>On the road · cars, workshop</small></div><div class="no">No. 14</div></div>
<div class="shop"><div class="sb" style="background:#141414;color:#f2c230">MENARA<small>Skyline · Merdeka 118</small></div><div class="no">No. 16</div></div>
<div class="shop"><div class="sb" style="background:#f2c230;color:#141414">KAMPUNG<small>Stilt house, wau, biawak</small></div><div class="no">No. 18</div></div></div>
<div class="arcade"><div class="cap">Kedai Kopi<small>Malaysia 3D Library · turn any object in 3D</small></div><div class="hero"></div><div class="floor"></div></div></body></html>
